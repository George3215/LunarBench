<!doctype html><meta charset="utf-8"><title>Task3 完整评测与难度校准</title><style>body{font:16px system-ui;background:#111925;color:#e4edf6;margin:30px;max-width:900px}a{color:#a4d4ff}pre{background:#202d3c;padding:16px;white-space:pre-wrap}</style><h1>Task3 完整评测与难度校准</h1><p>先完整评测与审计，再划分难度和调整地形。优先原地形起伏，新增障碍采用可复现方块，墙体限于窗口结构。每 trial 最多3000步，最多两次地形版本调整。</p><div id="state"></div><p><a id="trial" href="#">进入当前实验汇总与筛选</a> · <a href="FINAL_REPORT.md">全部完成后的最终报告</a> · <a href="FINAL_RESULTS.json">最终指标</a></p><script>async function refresh(){let r=await fetch('WORKFLOW_STATUS.json',{cache:'no-store'});let s=await r.json();document.getElementById('state').textContent=s.phase==='complete'?'所有评测和校准已完成':'流程尚未完成，暂不发布最终成功率';let pre=document.createElement('pre');pre.textContent=JSON.stringify(s,null,2);document.getElementById('state').appendChild(pre);let path=s.current_run||s.final_run;if(path){document.getElementById('trial').href='../../'+path.split('/paper/vlm_goal_navigation/')[1]+'/index.html'}}refresh();setInterval(refresh,30000)</script>
