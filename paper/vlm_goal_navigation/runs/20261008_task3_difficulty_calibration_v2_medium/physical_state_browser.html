<!doctype html><meta charset="utf-8"><title>Task3 物理状态</title><style>body{font:16px system-ui;margin:24px}select,button{font:inherit;padding:8px}img{max-width:100%}</style><h1>六条件物理路径、可见距离与姿态</h1><p>选择一个场景查看。数据来自 MuJoCo，未连接实体机械狗。图中距离曲线缺口表示目标不可见，红虚线为1m。</p><select id="scene"><option value="">选择场景</option></select><button onclick="show()">查看</button><div id="plot"></div><script>const names=["barrier", "basin", "perlin", "perlin_rough", "pit", "stairs_down", "stairs_up", "trench", "waves", "window_wall", "staircase10", "flat", "crater", "stairs", "undulating", "hist002_left", "hist002_right", "hist003_left", "hist003_right", "hist008_left", "hist008_right", "hist016_left", "hist016_right", "hist024_left", "hist024_right", "hist034_left", "hist034_right", "hist037_left", "hist037_right", "hist038_left", "hist038_right"];names.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;document.getElementById('scene').appendChild(o)});function show(){let n=document.getElementById('scene').value;if(!n)return;document.getElementById('plot').innerHTML='<h2>'+n+'</h2><img src="physical_plots/'+encodeURIComponent(n)+'.png">'}</script>
