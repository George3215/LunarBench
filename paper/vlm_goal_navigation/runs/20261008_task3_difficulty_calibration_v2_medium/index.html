ait response.text()).trim().split('\n').flatMap(l=>{try{return [JSON.parse(l)]}catch{return []}});if(id!==generation)return;T={s,base,frames,gate,initial,traces:traces.filter(t=>t.phase==='vlm_autonomous')};$('detail').innerHTML='<h2>'+esc(s.scene+' / '+s.mode+' / '+s.horizon)+'</h2>'+pre(s)+'<p>初始相机深度距离 '+initial.initial_depth_camera_range_m.toFixed(3)+' m；目标消失类型 '+esc(gate.loss_kind)+'。</p><details open><summary>初始观测（current组未提供给模型，仅供评估）</summary>'+pic(frames[0].rgb_path)+pic(frames[0].depth_path)+'</details><details open><summary>实际路径、可见距离和姿态图</summary>'+pic('physical_plots/'+s.scene+'.png')+'</details><section class="camera-panel"><h3>当前相机 RGB 与深度</h3><div class="camera-controls"><button id="prev">上一步</button><input id="step" type="number" min="0" max="'+Math.max(0,T.traces.length-1)+'" value="0" aria-label="自主决策记录序号"><button id="next">下一步</button><span> 共 '+T.traces.length+' 次自主决策（序号从0开始）</span></div><div id="current-camera"></div></section><div id="decision"></div>';let saved=null;try{saved=JSON.parse(sessionStorage.getItem('task3-view:'+location.pathname))}catch{};if(saved&&saved.trial===$('trial').value)$('step').value=Math.max(0,Math.min(T.traces.length-1,saved.step||0));$('step').onchange=show;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);show()}catch(e){$('detail').textContent=e.message}}async function show(){try{sessionStorage.setItem('task3-view:'+location.pathname,JSON.stringify({mode:$('mode').value,history:$('history').value,ending:$('ending').value,trial:$('trial').value,step:+$('step').value}))}catch{};let t=T.traces[+$('step').value];if(!t){$('decision').textContent='尚无自主决策记录';return}$('current-camera').innerHTML=pic(T.frames[t.frame_before].rgb_path)+pic(T.frames[t.frame_before].depth_path);let parsed=t.decision;let html='<h3>动作 '+t.step+'：'+esc(t.action)+'；结局 '+esc(t.termination||'继续')+'</h3><p>'+esc(parsed?.decision_rationale||'本次无有效动作输出')+'</p>'+pre({context:t.context,evidence_frames:parsed?.evidence_frames,evidence_sources:pars
